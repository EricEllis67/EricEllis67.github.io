<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FocusPulse — Minimalist Flow State Engine</title>
    <style>
        :root {
            --bg-color: #08080a;
            --card-bg: #121216;
            --border-color: #22222c;
            --text-main: #f0f0f5;
            --text-muted: #8e8e99;
            --accent: #6c5ce7;
            --accent-hover: #5b4be2;
            --danger: #ff6b6b;
            --success: #10ac84;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 10px;
        }

        header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        header h1 span {
            color: var(--accent);
        }

        header p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 4px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        /* Timer Styles */
        .timer-display {
            text-align: center;
            font-size: 4.5rem;
            font-weight: 800;
            letter-spacing: -2px;
            margin: 20px 0;
            color: #fff;
            font-variant-numeric: tabular-nums;
        }

        .timer-controls {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        button {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        button.secondary {
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
        }

        button.secondary:hover {
            background-color: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
        }

        /* Ambient / Vibe Section */
        .vibe-section h3, .journal-section h3 {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .vibe-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .vibe-btn {
            background-color: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 10px;
            font-size: 0.85rem;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
        }

        .vibe-btn.active {
            background-color: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        /* Journal / Intent Section */
        .journal-section textarea {
            width: 100%;
            height: 80px;
            background-color: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            color: var(--text-main);
            font-size: 0.9rem;
            resize: none;
            outline: none;
            transition: border-color 0.2s;
        }

        .journal-section textarea:focus {
            border-color: var(--accent);
        }

        .saved-status {
            font-size: 0.75rem;
            color: var(--success);
            margin-top: 6px;
            text-align: right;
            opacity: 0;
            transition: opacity 0.3s;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Header -->
        <header>
            <h1>Focus<span>Pulse</span></h1>
            <p>Deep work container & flow state engine</p>
        </header>

        <!-- Timer Card -->
        <div class="card">
            <div class="timer-display" id="timerDisplay">25:00</div>
            <div class="timer-controls">
                <button id="startBtn">Start Flow</button>
                <button id="resetBtn" class="secondary">Reset</button>
            </div>
        </div>

        <!-- Ambient Vibe Card -->
        <div class="card vibe-section">
            <h3>Ambient Frequency Generator</h3>
            <div class="vibe-grid">
                <button class="vibe-btn" data-freq="174">174 Hz (Pain)</button>
                <button class="vibe-btn" data-freq="285">285 Hz (Energy)</button>
                <button class="vibe-btn" data-freq="432">432 Hz (Deep)</button>
            </div>
        </div>

        <!-- Micro Journal Card -->
        <div class="card journal-section">
            <h3>Session Intention</h3>
            <textarea id="intentionInput" placeholder="What specific objective are you conquering right now?"></textarea>
            <div class="saved-status" id="saveStatus">Saved to memory ✓</div>
        </div>
    </div>

    <script>
        // --- Timer Logic ---
        const totalTime = 25 * 60;
        let timeLeft = totalTime;
        let timerId = null;
        let isRunning = false;

        const timerDisplay = document.getElementById('timerDisplay');
        const startBtn = document.getElementById('startBtn');
        const resetBtn = document.getElementById('resetBtn');

        function updateDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            timerDisplay.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }

        function toggleTimer() {
            if (isRunning) {
                clearInterval(timerId);
                startBtn.textContent = "Resume";
                isRunning = false;
            } else {
                isRunning = true;
                startBtn.textContent = "Pause";
                timerId = setInterval(() => {
                    if (timeLeft > 0) {
                        timeLeft--;
                        updateDisplay();
                    } else {
                        clearInterval(timerId);
                        alert("Focus session complete! Take a breather.");
                        resetTimer();
                    }
                }, 1000);
            }
        }

        function resetTimer() {
            clearInterval(timerId);
            isRunning = false;
            timeLeft = totalTime;
            startBtn.textContent = "Start Flow";
            updateDisplay();
        }

        startBtn.addEventListener('click', toggleTimer);
        resetBtn.addEventListener('click', resetTimer);

        // --- Web Audio API Ambient Sound Generator ---
        let audioCtx = null;
        let oscillator = null;
        let gainNode = null;
        let activeFreqBtn = null;

        const vibeButtons = document.querySelectorAll('.vibe-btn');

        vibeButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                const freq = parseInt(btn.dataset.getAttribute ? btn.dataset.getAttribute('freq') : btn.dataset.freq);

                if (btn.classList.contains('active')) {
                    stopAudio();
                    btn.classList.remove('active');
                    activeFreqBtn = null;
                    return;
                }

                vibeButtons.forEach(b => b.classList.remove('active'));
                stopAudio();

                playTone(freq);
                btn.classList.add('active');
                activeFreqBtn = btn;
            });
        });

        function playTone(freq) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            oscillator = audioCtx.createOscillator();
            gainNode = audioCtx.createGain();

            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(freq, audioCtx.currentTime);

            // Soft volume envelope so it doesn't pop
            gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
            gainNode.gain.linearRampToValueAtTime(0.05, audioCtx.currentTime + 1);

            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.start();
        }

        function stopAudio() {
            if (oscillator) {
                try {
                    oscillator.stop();
                    oscillator.disconnect();
                } catch(e) {}
                oscillator = null;
            }
            if (audioCtx) {
                audioCtx.close();
                audioCtx = null;
            }
        }

        // --- Local Storage Micro Journal ---
        const intentionInput = document.getElementById('intentionInput');
        const saveStatus = document.getElementById('saveStatus');

        // Load saved intention
        if (localStorage.getItem('focus_intention')) {
            intentionInput.value = localStorage.getItem('focus_intention');
        }

        let timeoutId;
        intentionInput.addEventListener('input', () => {
            clearTimeout(timeoutId);
            localStorage.setItem('focus_intention', intentionInput.value);
            
            saveStatus.style.opacity = '1';
            timeoutId = setTimeout(() => {
                saveStatus.style.opacity = '0';
            }, 1500);
        });
    </script>
</body>
</html>
